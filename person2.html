<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<title>視展 — VIEW 02</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f4f1}iframe{display:block;width:100%;height:100%;border:0;background:#f4f4f1}
</style>
</head>
<body>
<iframe id="view" src="index.html" title="VIEW 02"></iframe>
<script>
const frame=document.getElementById('view');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument,w=frame.contentWindow;
  if(!d)return;
  d.documentElement.style.setProperty('--p','#58c8ff');
  const style=d.createElement('style');
  style.textContent=`
    .title-mark{background:linear-gradient(transparent 70%,rgba(88,200,255,.42) 70%,rgba(88,200,255,.42) 94%,transparent 94%)!important}
    .hl{background:linear-gradient(transparent 62%,rgba(88,200,255,.34) 62%)!important}
    .views h2:after{background:rgba(88,200,255,.32)!important}
    .v:nth-child(1){--eye-color:#ff4f87!important}
    .v:nth-child(2){--eye-color:#58c8ff!important}
    .v:first-child b{color:#111!important}
    .v:first-child:before{content:none!important}
    .v:nth-child(2) b{color:#58c8ff!important}
    .v:nth-child(2):before{content:"NOW";position:absolute;z-index:6;top:-7px;right:-2px;background:#111;color:#fff;border-radius:99px;padding:1px 5px;font:900 7px Arial;letter-spacing:.08em}
  `;
  d.head.appendChild(style);
  const links=d.querySelectorAll('.views .v');
  if(links[0]){links[0].href='index.html';links[0].removeAttribute('aria-current');links[0].target='_top'}
  if(links[1]){links[1].href='person2.html';links[1].setAttribute('aria-current','page');links[1].target='_top'}
  for(let i=2;i<links.length;i++)links[i].target='_top';
  d.title='視展 — VIEW 02';
  try{w.history.replaceState(null,'','person2.html')}catch(e){}
});
</script>
</body>
</html>
