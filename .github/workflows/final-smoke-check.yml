name: Final Shiten Live Smoke Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-smoke-check.yml'
      - '.github/workflows/pages.yml'
      - 'index.html'
      - 'base.html'
      - 'core.html'
      - 'pupil-chase.js'
      - 'eye-attract.js'
      - 'eye-attract-core.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check 01 live in Chrome
        run: |
          python -m pip install --disable-pip-version-check selenium
          cat > /tmp/check.py <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          url='https://kanatama0416-glitch.github.io/person1-shiten/?smoke=20260919-eye-v3'
          o=webdriver.ChromeOptions()
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=412,915']:
            o.add_argument(a)
          o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=o)
          d.set_page_load_timeout(30)
          W=WebDriverWait(d,20)
          live=False
          for attempt in range(36):
            d.get(url+'&profile=thick-v1-'+str(attempt))
            body=d.find_element(By.TAG_NAME,'body').text
            if 'えまりん' in body and 'ありふれた「もの」に' in body:
              live=True
              break
            time.sleep(5)
          assert live, d.find_element(By.TAG_NAME,'body').text
          W.until(lambda x:'ページを読み込めませんでした。' not in x.find_element(By.TAG_NAME,'body').text)
          W.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.page'))>0)
          W.until(lambda x:len(x.find_elements(By.ID,'secretToggle'))>0)
          W.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.intro'))==0 and 'intro-lock' not in x.find_element(By.TAG_NAME,'body').get_attribute('class'))
          d.set_window_size(393,915)
          time.sleep(.2)
          profile=d.execute_script("""
            const sig=document.querySelector('.creator-signature');
            const books=[...document.querySelectorAll('.creator-spine')];
            const overflow=books.map((b,i)=>{
              const t=b.querySelector('.creator-spine__text');
              return {
                i,
                text:t?.innerText||'',
                textBottom:t ? t.offsetTop+t.offsetHeight : 0,
                clientHeight:b.clientHeight,
                scrollHeight:b.scrollHeight,
                scrollWidth:b.scrollWidth,
                clientWidth:b.clientWidth
              };
            }).filter(x=>x.textBottom>x.clientHeight-4 || x.scrollHeight>x.clientHeight+2 || x.scrollWidth>x.clientWidth+2);
            return {
              count:books.length,
              sigOverflow:sig ? sig.scrollWidth>sig.clientWidth+2 : true,
              overflow,
              text:document.body.innerText
            };
          """)
          assert profile['count']==5, profile
          assert not profile['sigOverflow'], profile
          assert not profile['overflow'], profile
          hobby=d.execute_script("""
            const all=[...document.querySelectorAll('.creator-spine')];
            const b=all.find(x=>x.innerText.includes('旅行や生き物など趣味が沢山あります。'));
            const r=b.getBoundingClientRect();
            return {w:r.width,h:r.height,text:b.innerText};
          """)
          assert hobby['w']>=68 and hobby['h']<=230, hobby
          for expected in ['えまりん','カード事業部','企画・開発課インターン生','旅行や生き物など趣味が沢山あります。','古今東西の美術や工芸が好きです！']:
            assert expected in profile['text'], (expected, profile)
          b=d.find_element(By.ID,'secretToggle')
          b.click();time.sleep(.4)
          assert d.execute_script("return document.body.classList.contains('secret-mode')")
          assert d.execute_script("return document.body.classList.contains('pupil-chase')")
          W.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'.escape-eye'))==5)
          labels=d.find_elements(By.CSS_SELECTOR,'.escape-eye .escape-label')
          assert len(labels)==5, len(labels)
          assert all(x.text.strip()=='黒目をタッチしよう！' for x in labels), [x.text for x in labels]
          assert d.execute_script("""
            const q=s=>document.querySelector(s);
            return getComputedStyle(q('.essay .secret-eye')).display==='none'
              && getComputedStyle(q('.view-eye-inline')).display==='none'
              && getComputedStyle(q('.book:nth-child(2)'),'::after').display==='none'
              && getComputedStyle(q('.book:nth-child(4)'),'::after').display==='none';
          """)
          overlaps=d.execute_script("""
            const targets=[...document.querySelectorAll('.escape-eye,.escape-eye .escape-label')];
            const text=[...document.querySelectorAll('.essay p,.info p')];
            const hit=(a,b)=>a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
            return targets.flatMap((el,i)=>text.filter(p=>hit(el.getBoundingClientRect(),p.getBoundingClientRect())).map(p=>[i,p.textContent.slice(0,30)]));
          """)
          assert not overlaps, overlaps
          b.click();time.sleep(.4)
          assert not d.execute_script("return document.body.classList.contains('secret-mode')"), d.find_element(By.TAG_NAME,'body').get_attribute('class')
          assert not d.execute_script("return document.body.classList.contains('pupil-chase')"), d.find_element(By.TAG_NAME,'body').get_attribute('class')
          assert len(d.find_elements(By.CSS_SELECTOR,'.pupil-runner,.escape-eye'))==0
          logs=d.get_log('browser')
          severe=[x for x in logs if x.get('level')=='SEVERE' and 'favicon.ico' not in x.get('message','')]
          assert not severe,severe
          print(json.dumps({'01':'load + 5 labels + no text overlap + decorative eyes hidden + toggle off ok','browser_logs':logs},ensure_ascii=False,indent=2))
          d.quit()
          PY
          python /tmp/check.py
