name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static 01 page
        run: |
          mkdir -p public
          cp ./*.js public/
          cp ./*.html public/
          python3 - <<'PY'
          from pathlib import Path
          import os

          html = Path('base.html').read_text(encoding='utf-8')

          # Keep the shortened intro used by the current 01 page.
          html = html.replace('},1050);introEye.animate','},250);introEye.animate')
          html = html.replace('duration:1650,delay:1250','duration:650,delay:250')
          html = html.replace('duration:1450,delay:1500','duration:600,delay:300')
          html = html.replace('},2980)','},1050)')

          # Keep horizontal overflow protection, About return link, and creator signature styling.
          extra_css = '''html,body{max-width:100%;overflow-x:hidden!important;overscroll-behavior-x:none}.about-shiten-link{position:relative;z-index:20;display:inline-flex;align-items:center;gap:9px;margin:14px 0 0 14px;padding:8px 11px 8px 9px;background:#111;color:#fff!important;text-decoration:none!important;border:2px solid #111;box-shadow:3px 3px 0 #ff4f87;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.about-shiten-link i{display:block;width:27px;height:16px;border:2px solid #fff;border-radius:50%;position:relative}.about-shiten-link i:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#ff4f87;left:8px;top:2.5px}.about-shiten-link strong{display:block;font-size:12px;line-height:1.05;letter-spacing:.02em}.about-shiten-link small{display:block;margin-top:3px;font:700 7px/1 Arial,sans-serif;letter-spacing:.14em;opacity:.72}.about-shiten-link:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #ff4f87}.creator-signature{display:flex;flex-direction:row-reverse;align-items:flex-end;justify-content:center;gap:5px;width:max-content;max-width:100%;margin:22px auto 0;padding:5px 7px 7px}.creator-spine{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:44px;height:224px;padding:12px 5px 10px;border:3px solid var(--k);border-radius:7px 7px 4px 4px;box-shadow:3px 3px 0 var(--k);background:#fff;transform-origin:bottom center}.creator-spine__text{writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;font-size:14px;line-height:1.5;font-weight:800;letter-spacing:.02em;text-align:start}.creator-spine__text span{ text-combine-upright:all}.creator-spine__label{position:absolute;top:9px;left:0;right:0;text-align:center;font-size:10px;line-height:1.2;font-weight:800;letter-spacing:.08em;writing-mode:horizontal-tb}.creator-spine--name .creator-spine__text,.creator-spine--role .creator-spine__text{margin-top:20px}.creator-spine__icon{display:block;flex:none;width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.creator-spine--name{height:194px;width:48px;background:var(--p);transform:rotate(2deg)}.creator-spine--name .creator-spine__text{font-size:21px;font-weight:900;letter-spacing:.12em}.creator-spine--role{height:232px;background:#fff;transform:rotate(-1deg)}.creator-spine--hamster{height:216px;background:var(--gray)}.creator-spine--bio{height:250px;width:67px;background:var(--k);color:#fff;transform:rotate(-2deg)}.creator-spine--bio .creator-spine__text{font-weight:700;line-height:1.65;letter-spacing:0}'''
          html = html.replace('<style>', '<style>' + extra_css, 1)
          about = 'https://kanatama0416-glitch.github.io/about-shiten/'
          about_link = '<a class="about-shiten-link" href="'+about+'" aria-label="視展についてへ戻る"><i aria-hidden="true"></i><span><strong>← 視展について</strong><small>ABOUT SHITEN</small></span></a>'
          html = html.replace('<body class="intro-lock">', '<body class="intro-lock">' + about_link, 1)

          # Put the creator introduction directly below the page title.
          signature = '<div class="creator-signature" aria-label="この視点を書いた人"><div class="creator-spine creator-spine--name"><span class="creator-spine__label">名前</span><div class="creator-spine__text">かなち</div><svg class="creator-spine__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c4-8 16-8 20 0-4 8-16 8-20 0Z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg></div><div class="creator-spine creator-spine--role"><span class="creator-spine__label">担当</span><div class="creator-spine__text"><span>DX</span>推進担当（〜9月）</div><svg class="creator-spine__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="12" rx="1"/><path d="M12 15v5m-5 0h10"/></svg></div><div class="creator-spine creator-spine--hamster"><div class="creator-spine__text">ハムスター愛好家</div><svg class="creator-spine__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8C0 1 9 0 9 6m6 0c0-6 9-5 4 2M4 10c0-7 16-7 16 0v4c0 8-16 8-16 0Z"/><path d="M8 11h.1M16 11h.1M11 15h2m-1 0v2"/></svg></div><div class="creator-spine creator-spine--bio"><div class="creator-spine__text">写真とアプリ開発が趣味。<br><span>10</span>月から石川県民。</div><svg class="creator-spine__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l2-3h4l2 3h4v14H4V6Z"/><circle cx="12" cy="13" r="4"/></svg></div></div>'
          hero_start = html.find('<section class="hero">')
          h1_end = html.find('</h1>', hero_start)
          if hero_start < 0 or h1_end < 0:
              raise RuntimeError('hero title not found')
          h1_end += len('</h1>')
          html = html[:h1_end] + signature + html[h1_end:]

          # Keep the latest 01 copy.
          start = html.find('<section class="essay">')
          end = html.find('</section>', start)
          if start < 0 or end < 0:
              raise RuntimeError('essay section not found')
          end += len('</section>')
          new_essay = '''<section class="essay"><span class="secret-eye" aria-hidden="true"></span><p>毎日同じ道を歩く。同じ電車に乗る。<br>変わらないように見える日々の中で、毎日見ていたはずのものに、ある日初めて気づくことがある。</p><p>何かを知ったり、誰かと出会ったりして、自分の中に少し変化が生まれる。すると、それまで気にも留めなかったものが、ふと気にかかるようになる。</p><p>そんなとき、私は「世界の解像度が上がった」と感じる。<br>粗いピクセルの中では見えなかったものが、輪郭を持って見えてくるように。気づけるものが増え、同じ景色から受け取れる意味が増えていく。</p><p>そのきっかけは、人によっても、そのときどきによっても違う。<br>私の場合は、アートとの出会いがきっかけになることが多い。</p><p>私にとってアートに触れることは、自分が見過ごしていたものに着目し、ときには執着するほど見つめてきた人の視点に触れることでもある。<br>なぜ、この人はここが気になったのだろう。何を見つけ、どんなふうに感じていたのだろう。</p><p>作品を通してその人の視点に触れると、自分の中にも、ものの見方が一つ増える。それまで背景に溶け込んでいたものが気になったり、見慣れたものに別の意味を感じたりする。</p><p>誰かの視点を通して、自分の世界が少し広がる。<br>アートに触れたあと、いつもの道が少し違って見える。その変化が、私にとってアートの面白さなのだと思う。</p></section>'''
          html = html[:start] + new_essay + html[end:]

          old_onsen = '横尾忠則が訪れた温泉地での出来事と、そこから生まれた絵を一緒に見ることができます。個人的な記憶や経験が、どのように作品へとつながっていくのか。その人が見たものと、描いたものの間をたどることができる一冊です。'
          new_onsen = '横尾忠則の作品には、目にした景色や体験、感じたこと、空想したことが重なり合っている。なぜこの絵になったのだろう、と不思議に思うことも多い。『温泉主義』では、温泉を旅した紀行文と、その土地をモチーフにした作品が並び、作品の背景をたどることができる。不思議だった絵に、彼の記憶や感情の重なりが見えてくる。同じ絵なのに、読み取れるものが増えていく。行き先には有名な温泉地も多く、この本を読んだあとに実際にその土地を訪ねれば、彼の内側に広がっていた世界と、目の前の風景とが重なり合い、作品をより深く感じられるのではないかと思う。'
          html = html.replace(old_onsen, new_onsen)

          pages = [
              'https://kanatama0416-glitch.github.io/person1-shiten/',
              'https://kanatama0416-glitch.github.io/person2-shiten/',
              'https://kanatama0416-glitch.github.io/person3-shiten/',
              'https://kanatama0416-glitch.github.io/person4-shiten/',
              'https://kanatama0416-glitch.github.io/person5-shiten/'
          ]
          old_links = [
              '<a class="v" href="#" aria-current="page">',
              '<a class="v" href="person2.html">',
              '<a class="v" href="person3.html">',
              '<a class="v" href="person4.html">',
              '<a class="v" href="person5.html">'
          ]
          for i, (old, url) in enumerate(zip(old_links, pages)):
              current = ' aria-current="page"' if i == 0 else ''
              new = f'<a class="v" href="{url}" onclick="window.location.assign(\'{url}\');return false;"{current}>'
              html = html.replace(old, new)

          version = os.environ.get('GITHUB_SHA','static')[:10]
          extras = f'''<script>document.addEventListener("click",function(e){{var b=e.target.closest&&e.target.closest("#secretToggle,#tearToggle");if(b)window.scrollTo(0,0)}},true);</script>
          <script src="./pupil-chase.js?v={version}"></script>
          <script src="./eye-attract.js?v={version}"></script>'''
          html = html.replace('</body>', extras + '\n</body>', 1)

          Path('public/index.html').write_text(html, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
