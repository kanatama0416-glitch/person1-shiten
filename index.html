<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f4f1"><title>視展 — 01</title><style>html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;background:#f4f4f1}body{visibility:hidden}</style></head><body><script>
(async()=>{const current=1,pages=['https://kanatama0416-glitch.github.io/person1-shiten/','https://kanatama0416-glitch.github.io/person2-shiten/','https://kanatama0416-glitch.github.io/person3-shiten/','https://kanatama0416-glitch.github.io/person4-shiten/','https://kanatama0416-glitch.github.io/person5-shiten/'],about='https://kanatama0416-glitch.github.io/about-shiten/';try{let html=await(await fetch('https://raw.githubusercontent.com/kanatama0416-glitch/person1-shiten/93246663e808f739feba769129b4593087c794cf/index.html',{cache:'no-store'})).text();html=html.replace('<style>','<style>html,body{max-width:100%;overflow-x:hidden!important;overscroll-behavior-x:none}.about-shiten-link{position:relative;z-index:20;display:inline-flex;align-items:center;gap:9px;margin:14px 0 0 14px;padding:8px 11px 8px 9px;background:#111;color:#fff!important;text-decoration:none!important;border:2px solid #111;box-shadow:3px 3px 0 #ff4f87;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.about-shiten-link i{display:block;width:27px;height:16px;border:2px solid #fff;border-radius:50%;position:relative}.about-shiten-link i:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#ff4f87;left:8px;top:2.5px}.about-shiten-link strong{display:block;font-size:12px;line-height:1.05;letter-spacing:.02em}.about-shiten-link small{display:block;margin-top:3px;font:700 7px/1 Arial,sans-serif;letter-spacing:.14em;opacity:.72}.about-shiten-link:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #ff4f87}');const aboutLink='<a class="about-shiten-link" href="'+about+'" aria-label="視展についてへ戻る"><i aria-hidden="true"></i><span><strong>← 視展について</strong><small>ABOUT SHITEN</small></span></a>';html=html.replace(/<body([^>]*)>/i,(m,attrs)=>'<body'+attrs+'>'+aboutLink);const newEssay='<section class="essay"><span class="secret-eye" aria-hidden="true"></span><p>毎日同じ道を歩く。同じ電車に乗る。<br>変わらないように見える日々の中で、毎日見ていたはずのものに、ある日初めて気づくことがある。</p><p>何かを知ったり、誰かと出会ったりして、自分の中に少し変化が生まれる。すると、それまで気にも留めなかったものが、ふと気にかかるようになる。</p><p>そんなとき、私は「世界の解像度が上がった」と感じる。<br>粗いピクセルの中では見えなかったものが、輪郭を持って見えてくるように。気づけるものが増え、同じ景色から受け取れる意味が増えていく。</p><p>そのきっかけは、人によっても、そのときどきによっても違う。<br>私の場合は、アートとの出会いがきっかけになることが多い。</p><p>私にとってアートに触れることは、自分が見過ごしていたものに着目し、ときには執着するほど見つめてきた人の視点に触れることでもある。<br>なぜ、この人はここが気になったのだろう。何を見つけ、どんなふうに感じていたのだろう。</p><p>作品を通してその人の視点に触れると、自分の中にも、ものの見方が一つ増える。それまで背景に溶け込んでいたものが気になったり、見慣れたものに別の意味を感じたりする。</p><p>誰かの視点を通して、自分の世界が少し広がる。<br>アートに触れたあと、いつもの道が少し違って見える。その変化が、私にとってアートの面白さなのだと思う。</p></section>';html=html.replace(/<section class="essay">[\s\S]*?<\/section>/,newEssay);const oldOnsen2='横尾忠則が訪れた温泉地での出来事と、そこから生まれた絵を一緒に見ることができます。個人的な記憶や経験が、どのように作品へとつながっていくのか。その人が見たものと、描いたものの間をたどることができる一冊です。';const newOnsen='横尾忠則の作品には、目にした景色や体験、感じたこと、空想したことが重なり合っている。なぜこの絵になったのだろう、と不思議に思うことも多い。『温泉主義』では、温泉を旅した紀行文と、その土地をモチーフにした作品が並び、作品の背景をたどることができる。不思議だった絵に、彼の記憶や感情の重なりが見えてくる。同じ絵なのに、読み取れるものが増えていく。行き先には有名な温泉地も多く、この本を読んだあとに実際にその土地を訪ねれば、彼の内側に広がっていた世界と、目の前の風景とが重なり合い、作品をより深く感じられるのではないかと思う。';html=html.replace(oldOnsen2,newOnsen);let navIndex=0;html=html.replace(/<a class="v" href="[^"]*"(?: aria-current="page")?>/g,()=>{const i=navIndex++,url=pages[i];return `<a class="v" href="${url}" onclick="window.location.assign('${url}');return false;"${i===current-1?' aria-current="page"':''}>`});if(navIndex!==5)throw new Error('navigation build failed');const chaseCss='\n.pupil-runner{position:absolute;width:22px;height:22px;border-radius:50%;background:#111;z-index:10050;box-shadow:5px -5px 0 -3px #fff;transform:translate(-50%,-50%) scale(0);transition:left .48s cubic-bezier(.18,.9,.3,1.12),top .48s cubic-bezier(.18,.9,.3,1.12),transform .24s ease;cursor:pointer;touch-action:manipulation}.pupil-runner.on{transform:translate(-50%,-50%) scale(1)}.pupil-runner:active{transform:translate(-50%,-50%) scale(.72)}body.pupil-chase .secret-iris:after{opacity:0}.pupil-msg{position:fixed;z-index:10049;left:50%;bottom:72px;transform:translateX(-50%) translateY(8px);background:#fff;border:3px solid #111;box-shadow:4px 4px 0 var(--p);padding:7px 12px;font:900 11px/1.2 system-ui,sans-serif;opacity:0;pointer-events:none;transition:.2s}.pupil-msg.show{opacity:1;transform:translateX(-50%) translateY(0)}\n';html=html.replace('</style>',chaseCss+'</style>');const chaseScript='<scr'+'ipt>'+ "(()=>{const t=document.getElementById('secretToggle');if(!t)return;let running=false,step=0,dot=null,msg=null;const spots=[['.hero h1',.78,.20],['.essay',.90,.43],['.book:nth-child(3)',.12,.28],['.book:nth-child(5)',.88,.62],['.views h2',.18,.45]];function say(s){if(!msg){msg=document.createElement('div');msg.className='pupil-msg';document.body.appendChild(msg)}msg.textContent=s;msg.classList.add('show');clearTimeout(say.x);say.x=setTimeout(()=>msg.classList.remove('show'),1100)}function pos(el,fx,fy){const r=el.getBoundingClientRect();return{x:r.left+scrollX+r.width*fx,y:r.top+scrollY+r.height*fy}}function move(){if(step>=spots.length){finish();return}const a=spots[step],el=document.querySelector(a[0]);if(!el){step++;move();return}el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>{const p=pos(el,a[1],a[2]);dot.style.left=p.x+'px';dot.style.top=p.y+'px'},260)}function catchDot(e){e.preventDefault();e.stopPropagation();step++;if(step<spots.length){say(step===1?'まだまだ！':step===3?'そっちじゃないよ〜':'つかまるか！');move()}else finish()}function finish(){const r=t.getBoundingClientRect();dot.style.position='fixed';dot.style.left=(r.left+r.width/2)+'px';dot.style.top=(r.top+r.height/2)+'px';say('ただいま。');setTimeout(()=>{dot.classList.remove('on');document.body.classList.remove('pupil-chase');setTimeout(()=>{dot.remove();dot=null;running=false;step=0},260)},520)}function start(e){if(running)return;e.preventDefault();e.stopImmediatePropagation();document.body.classList.remove('secret-mode');t.setAttribute('aria-pressed','false');running=true;step=0;const r=t.querySelector('.secret-iris').getBoundingClientRect();dot=document.createElement('button');dot.type='button';dot.className='pupil-runner';dot.setAttribute('aria-label','逃げた黒目をつかまえる');dot.style.left=(r.left+r.width/2+scrollX)+'px';dot.style.top=(r.top+r.height/2+scrollY)+'px';document.body.appendChild(dot);document.body.classList.add('pupil-chase');dot.addEventListener('click',catchDot);requestAnimationFrame(()=>{dot.classList.add('on');say('えっ、逃げた！ つかまえて！');setTimeout(move,180)})}t.addEventListener('click',start,true)})();" +'</scr'+'ipt>';html=html.replace('</body>',chaseScript+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.style.visibility='visible';document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui">ページを読み込めませんでした。</div>'}})();
</script></body></html>
