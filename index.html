<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f4f1"><title>視展 — 01</title><style>html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;background:#f4f4f1}body{visibility:hidden}</style></head><body><script>
(async()=>{
const current=1,pages=['https://kanatama0416-glitch.github.io/person1-shiten/','https://kanatama0416-glitch.github.io/person2-shiten/','https://kanatama0416-glitch.github.io/person3-shiten/','https://kanatama0416-glitch.github.io/person4-shiten/','https://kanatama0416-glitch.github.io/person5-shiten/'],about='https://kanatama0416-glitch.github.io/about-shiten/';
try{
let response=await fetch('./base.html',{cache:'no-store'});
if(!response.ok)throw new Error('base.html '+response.status);
let html=await response.text();

html=html.replace('},1050);introEye.animate','},250);introEye.animate')
         .replaceAll('duration:1650,delay:1250','duration:650,delay:250')
         .replace('duration:1450,delay:1500','duration:600,delay:300')
         .replace('},2980)','},1050)');

html=html.replace('<title>世界の解像度を上げる視点</title>','<title>ありふれた「もの」に新たな意味を見出す視点</title>')
         .replace('<h1><span class="title-mark">世界の解像度を</span><br><span class="title-mark">上げる視点</span></h1>','<h1><span class="title-mark">ありふれた「もの」に</span><br><span class="title-mark">新たな意味を見出す視点</span></h1>');

html=html.replace('<style>','<style>html,body{max-width:100%;overflow-x:hidden!important;overscroll-behavior-x:none}.about-shiten-link{position:relative;z-index:20;display:inline-flex;align-items:center;gap:9px;margin:14px 0 0 14px;padding:8px 11px 8px 9px;background:#111;color:#fff!important;text-decoration:none!important;border:2px solid #111;box-shadow:3px 3px 0 #ff4f87;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.about-shiten-link i{display:block;width:27px;height:16px;border:2px solid #fff;border-radius:50%;position:relative}.about-shiten-link i:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#ff4f87;left:8px;top:2.5px}.about-shiten-link strong{display:block;font-size:12px;line-height:1.05;letter-spacing:.02em}.about-shiten-link small{display:block;margin-top:3px;font:700 7px/1 Arial,sans-serif;letter-spacing:.14em;opacity:.72}.about-shiten-link:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #ff4f87}.creator-signature{display:flex;flex-direction:row-reverse;align-items:flex-end;justify-content:center;gap:5px;width:max-content;max-width:100%;margin:22px auto 0;padding:5px 7px 7px}.creator-spine{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:44px;height:224px;padding:12px 5px 10px;border:3px solid var(--k);border-radius:7px 7px 4px 4px;box-shadow:3px 3px 0 var(--k);background:#fff;transform-origin:bottom center}.creator-spine__text{writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;font-size:14px;line-height:1.5;font-weight:800;letter-spacing:.02em;text-align:start}.creator-spine__text span{ text-combine-upright:all}.creator-spine__label{position:absolute;top:9px;left:0;right:0;text-align:center;font-size:10px;line-height:1.2;font-weight:800;letter-spacing:.08em;writing-mode:horizontal-tb}.creator-spine--name .creator-spine__text,.creator-spine--role .creator-spine__text{margin-top:20px}.creator-spine__icon{display:block;flex:none;width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.creator-spine--name{height:194px;width:48px;background:var(--p);transform:rotate(2deg)}.creator-spine--name .creator-spine__text{font-size:21px;font-weight:900;letter-spacing:.12em}.creator-spine--role{height:232px;background:#fff;transform:rotate(-1deg)}.creator-spine--hamster{height:216px;background:var(--gray)}.creator-spine--bio{height:250px;width:67px;background:var(--k);color:#fff;transform:rotate(-2deg)}.creator-spine--bio .creator-spine__text{font-weight:700;line-height:1.65;letter-spacing:0}');

const aboutLink='<a class="about-shiten-link" href="'+about+'" aria-label="視展についてへ戻る"><i aria-hidden="true"></i><span><strong>← 視展について</strong><small>ABOUT SHITEN</small></span></a>';
html=html.replace(/<body([^>]*)>/i,(m,attrs)=>'<body'+attrs+'>'+aboutLink);

const signature='<div class="creator-signature" aria-label="この視点を書いた人"><div class="creator-spine creator-spine--name"><span class="creator-spine__label">名前</span><div class="creator-spine__text">えまりん</div><svg class="creator-spine__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c4-8 16-8 20 0-4 8-16 8-20 0Z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg></div><div class="creator-spine creator-spine--role"><span class="creator-spine__label">所属</span><div class="creator-spine__text">カード事業部</div><svg class="creator-spine__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="12" rx="1"/><path d="M12 15v5m-5 0h10"/></svg></div><div class="creator-spine creator-spine--role" style="height:284px"><span class="creator-spine__label">所属</span><div class="creator-spine__text">企画・開発課インターン生</div><svg class="creator-spine__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="12" rx="1"/><path d="M12 15v5m-5 0h10"/></svg></div><div class="creator-spine creator-spine--hamster"><div class="creator-spine__text">旅行や生き物など</div><svg class="creator-spine__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8C0 1 9 0 9 6m6 0c0-6 9-5 4 2M4 10c0-7 16-7 16 0v4c0 8-16 8-16 0Z"/><path d="M8 11h.1M16 11h.1M11 15h2m-1 0v2"/></svg></div><div class="creator-spine creator-spine--role"><div class="creator-spine__text" style="margin-top:0">趣味が沢山あります。</div><svg class="creator-spine__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19c4-8 12-8 16 0"/><path d="M8 9a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z"/></svg></div><div class="creator-spine creator-spine--bio" style="height:310px"><div class="creator-spine__text">古今東西の美術や工芸が好きです！</div><svg class="creator-spine__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l2-3h4l2 3h4v14H4V6Z"/><circle cx="12" cy="13" r="4"/></svg></div></div>'
html=html.replace(/(<section class="hero">[\s\S]*?<h1>[\s\S]*?<\/h1>)/i,(match)=>match+signature);

const newEssay='<section class="essay"><span class="secret-eye" aria-hidden="true"></span><p>服や本、コンクリートや土、赤や青などの色彩、光や影…私たちの生活は、様々な物質や事象にあふれています。このように私たちが普段何気なく接している「もの」を、アーティストたちは独自の視点で見つめ、美しさや面白さを丁寧に見出し表現します。アーティスト自身の言葉や作品や彼らの思想が綴られた本を通して、そうした新しい「もの」の見方を知った時、私の目を通して見る世界も、今までよりも新鮮な美しさや面白さに満ちあふれたものに感じられます。</p></section>';
html=html.replace(/<section class="essay">[\s\S]*?<\/section>/,newEssay);

const oldOnsen2='横尾忠則が訪れた温泉地での出来事と、そこから生まれた絵を一緒に見ることができます。個人的な記憶や経験が、どのように作品へとつながっていくのか。その人が見たものと、描いたものの間をたどることができる一冊です。';
const newOnsen='横尾忠則の作品には、目にした景色や体験、感じたこと、空想したことが重なり合っている。なぜこの絵になったのだろう、と不思議に思うことも多い。『温泉主義』では、温泉を旅した紀行文と、その土地をモチーフにした作品が並び、作品の背景をたどることができる。不思議だった絵に、彼の記憶や感情の重なりが見えてくる。同じ絵なのに、読み取れるものが増えていく。行き先には有名な温泉地も多く、この本を読んだあとに実際にその土地を訪ねれば、彼の内側に広がっていた世界と、目の前の風景とが重なり合い、作品をより深く感じられるのではないかと思う。';
html=html.replace(oldOnsen2,newOnsen);

let navIndex=0;
html=html.replace(/<a class="v" href="[^"]*"(?: aria-current="page")?>/g,(match)=>{
  const i=navIndex++,url=pages[i];
  if(!url)return match;
  return `<a class="v" href="${url}" onclick="window.location.assign('${url}');return false;"${i===current-1?' aria-current="page"':''}>`;
});

const extras='<script>document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("#secretToggle,#tearToggle");if(b)window.scrollTo(0,0)},true);<\/script>'
  +'<script src="./pupil-chase.js?v=20260919-eye-chase-fix-v4"><\/script>'
  +'<script src="./eye-attract.js?v=20260916-stable"><\/script>';
html=html.replace('</body>',extras+'</body>');

document.open();document.write(html);document.close();
}catch(e){
console.error('01 bootstrap failed',e);document.body.style.visibility='visible';document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui">ページを読み込めませんでした。</div>';
}
})();
</script></body></html>
